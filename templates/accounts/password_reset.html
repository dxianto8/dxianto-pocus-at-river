{% extends "base.html" %}{% block title %}Reset Password | Pocus at River{% endblock %}
{% block content %}
<section class="wrap auth-simple">
  <h1>Reset your password</h1>
  <p>Enter the email on your account. If it matches, we email you a reset link.</p>
  <form method="post" class="form">{% csrf_token %}{% include "includes/form_fields.html" %}<button class="button" type="submit">Send reset link</button></form>
  <p><a href="{% url 'accounts:login' %}">Back to log in</a></p>
</section>
{% endblock %}
