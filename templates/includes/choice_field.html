<fieldset class="field field--choices{% if wide %} field--wide{% endif %}{% if field.errors %} field--invalid{% endif %}"{% if field.help_text %} aria-describedby="{{ field.auto_id }}_helptext"{% endif %}>
  <legend>{{ field.label }}</legend>
  <div class="choices">{% for choice in field %}<label class="choice" for="{{ choice.id_for_label }}">{{ choice.tag }}<span>{{ choice.choice_label }}</span></label>{% endfor %}</div>
  {% if field.help_text %}<div class="help-text" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}{{ field.errors }}
</fieldset>
