{% load static %}
<div class="event-journal">{% for event in events %}<article><div class="event-journal__media photo-frame" data-photo-motion><img decoding="async" src="{% static event.image_path %}" alt="{{ event.photo_caption|default:event.title }}" width="1200" height="900" loading="lazy"></div><div><p class="section-label">{{ event.category }} · {{ event.event_date|date:"F Y" }}</p><h2 class="display">{{ event.title }}</h2><p>{{ event.summary|linebreaksbr }}</p>{% if event.photo_caption %}<p class="caption">{{ event.photo_caption }}</p>{% endif %}</div></article>{% endfor %}</div>
