{% extends "base.html" %}
{% block title %}Page Not Found | Pocus at River{% endblock %}
{% block content %}
<section class="wrap page-head">
  <h1>We couldn't find that page</h1>
  <p>The link may be old, or the address may have a typo.</p>
</section>
<section class="wrap section error-help">
  <p class="actions">
    <a class="button" href="{% url 'home' %}">Go to the home page</a>
    <a class="button button--quiet" href="{% url 'bookings:book' %}">Check open dates</a>
  </p>
  <p class="muted">Still stuck? <a href="mailto:{{ venue.contact_email }}">Email the venue</a> and we will help.</p>
</section>
{% endblock %}
