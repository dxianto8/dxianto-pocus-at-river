{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Something Went Wrong | Pocus at River</title>
  <link rel="icon" href="{% static 'images/badge.png' %}" type="image/png">
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body>
  <main id="main">
    <section class="wrap page-head">
      <h1>Something went wrong on our side</h1>
      <p>Nothing you did caused this. Please try again in a moment.</p>
    </section>
    <section class="wrap section error-help">
      <p class="actions"><a class="button" href="/">Go to the home page</a></p>
      <p class="muted">If it keeps happening, email <a href="mailto:events@pocusatriver.com">events@pocusatriver.com</a>. Any request you already sent is safe.</p>
    </section>
  </main>
</body>
</html>
