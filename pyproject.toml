[project]
name = "pocus-at-river"
version = "0.3.0"
description = "Website and booking system for Pocus at River, Aurora IL"
requires-python = ">=3.13"
# Vercel installs these. Docker installs requirements.txt; a test keeps the two lists identical.
dependencies = [
  "Django==6.1.3",
  "dj-database-url==3.1.2",
  "gunicorn==27.0.0",
  "psycopg[binary]==3.3.8",
  "whitenoise==6.12.0",
]

# Vercel: runs after dependencies are installed, before the new version goes live.
# (Vercel runs collectstatic itself.)
[tool.vercel.scripts]
build = "python scripts/vercel_build.py"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "--browser chromium --tracing off"
markers = ["e2e: browser tests (need Playwright's Chromium installed)"]
# WhiteNoise warns that collected static files don't exist; in development they don't need to.
filterwarnings = ["ignore:No directory at:UserWarning"]
# "D:" only sets a value when it isn't already set, so docker-compose's values win.
env = [
  "D:DATABASE_URL=postgres://pocus:pocus@localhost:5432/pocus",
  "D:DJANGO_DEBUG=true",
  # Playwright's sync API runs an event loop in the test thread; Django's ORM is safe to use there.
  "DJANGO_ALLOW_ASYNC_UNSAFE=true",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["bookings/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "SIM"]
